# How Netlify builds and serves the game (chesscampaign.com).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a recent Node.js.
  NODE_VERSION = "22"

# Fairy-Stockfish uses several threads, which browsers only allow on "cross-origin
# isolated" pages; these two headers turn that on (the dev server sends the same ones,
# see vite.config.js).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
