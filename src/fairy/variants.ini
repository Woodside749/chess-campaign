# Our fairy chess variants, in Fairy-Stockfish's variants.ini format. Both the rules
# library (ffish) and the engine (Fairy-Stockfish) load this file.
# Each variant starts from normal chess and replaces the queenside knight (or the queen).
# Pieces can be built-in (archbishop, chancellor) or our own, described in Betza
# notation: customPiece1 = z:QN means a piece written "z" that moves like a Queen and a kNight.

# Round 1: the Archbishop moves like a knight and a bishop.
[archchess:chess]
archbishop = a
startFen = rabqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RABQKBNR w KQkq - 0 1

# Semi-final: the Chancellor moves like a knight and a rook.
[chancellorchess:chess]
chancellor = c
startFen = rcbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RCBQKBNR w KQkq - 0 1

# Final: the Amazon (our own custom piece) moves like a queen and a knight.
[amazonchess:chess]
customPiece1 = z:QN
startFen = rnbzkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBZKBNR w KQkq - 0 1
