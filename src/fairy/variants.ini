# Our fairy chess variants, in Fairy-Stockfish's variants.ini format. Both the rules
# library (ffish) and the engine (Fairy-Stockfish) load this file.
# Each fairy variant starts from normal chess and swaps some pieces for fairy pieces.
# Pieces can be built-in (archbishop, chancellor) or our own, described in Betza
# notation: customPiece1 = z:QN means a piece written "z" that moves like a Queen and a kNight.
# Our pieces (the same letter in every variant):
#   a Archbishop  bishop + knight           c Chancellor   rook + knight
#   z Amazon      queen + knight            e Centaur      king + knight
#   l Camel       long (3,1) jump           i Nightrider   repeated knight jumps in a line
#   o Cannon      moves like a rook, captures by hopping over exactly one piece
#   h Dragon Horse bishop + one step straight
# When the rooks are replaced, castlingRookPieces says which piece castles instead.

# ---------- Amateur Fairy Cup ----------
# Round 1: both knights become Archbishops.
[archchess:chess]
archbishop = a
startFen = rabqkbar/pppppppp/8/8/8/8/PPPPPPPP/RABQKBAR w KQkq - 0 1

# Semi-final: both rooks become Chancellors (and castle like rooks).
[chancellorchess:chess]
chancellor = c
castlingRookPieces = c
startFen = cnbqkbnc/pppppppp/8/8/8/8/PPPPPPPP/CNBQKBNC w KQkq - 0 1

# Final: the queen becomes an Amazon and both knights become Centaurs.
[amazonchess:chess]
customPiece1 = z:QN
customPiece2 = e:KN
startFen = rebzkber/pppppppp/8/8/8/8/PPPPPPPP/REBZKBER w KQkq - 0 1

# ---------- Master Fairy ----------
# "Leapers": knights become Nightriders, bishops become Camels.
[leapers:chess]
customPiece1 = i:NN
customPiece2 = l:C
startFen = rilqklir/pppppppp/8/8/8/8/PPPPPPPP/RILQKLIR w KQkq - 0 1

# "Eastern": rooks become Cannons (Chinese chess), bishops become Dragon Horses (Japanese chess).
[eastern:chess]
customPiece1 = o:mRcpR
customPiece2 = h:BW
castlingRookPieces = o
startFen = onhqkhno/pppppppp/8/8/8/8/PPPPPPPP/ONHQKHNO w KQkq - 0 1

# "Royal court": rooks become Chancellors, bishops become Archbishops.
[royalcourt:chess]
chancellor = c
archbishop = a
castlingRookPieces = c
startFen = cnaqkanc/pppppppp/8/8/8/8/PPPPPPPP/CNAQKANC w KQkq - 0 1

# Advanced tier: Pawn Race. Win by getting a pawn to the far side. Pawns don't promote
# here (no promotion region), so the pawn stays a pawn and reaching the last rank wins.
[pawnrace:chess]
flagPiece = p
flagRegionWhite = *8
flagRegionBlack = *1
promotionRegionWhite = -
promotionRegionBlack = -

# ---------- Master tier ----------
# Duck Chess: after every move you also move the duck (a wall nobody can pass or take) to
# any empty square. There is no check: the king is an ordinary piece (a "commoner") that
# can be captured, and capturing it wins. Having no move at all also wins.
[duckchess:chess]
wallingRule = duck
king = -
commoner = k
castlingKingPiece = k
extinctionValue = loss
extinctionPieceTypes = k
stalemateValue = win
